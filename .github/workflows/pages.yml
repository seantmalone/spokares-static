# Build the site with a pinned Hugo, check it, and publish the review
# preview to GitHub Pages. A commit to main builds, checks and publishes.
# A pull request (including one from a fork) only builds and checks: it
# gets a read-only token, no secrets, and the publish job does not run.
name: Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0
  HUGO_SHA256: fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install Hugo (pinned, checksum verified)
        run: |
          f=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$f"
          echo "$HUGO_SHA256  $RUNNER_TEMP/$f" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/hugo" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build and check (site/tools/build.sh)
        env:
          # On a pull request there is no Pages address; the preview path is used.
          BASE_URL: ${{ steps.pages.outputs.base_url || 'http://localhost/spokares-static' }}
        run: site/tools/build.sh "$BASE_URL/"
      - name: Report on outside links (does not block)
        continue-on-error: true
        timeout-minutes: 4
        run: python3 site/tools/check_links.py site/public --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    name: Publish the preview
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
