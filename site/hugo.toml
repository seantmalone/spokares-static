baseURL = "https://spokares.org/"
locale = "en-US"
title = "Spokane County ARES-ACS"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "section"]
enableRobotsTXT = false
disableHugoGeneratorInject = true
uglyURLs = false

# preview = true marks every page "noindex" (keep search engines away from a
# review copy). Build the real spokares.org site with preview off, for
# example: HUGO_PARAMS_PREVIEW=false hugo --source site --baseURL https://spokares.org/
# and check it with: python3 site/tools/check_site.py site/public --live
[params]
  preview = true

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.parser.attribute]
  title = true
  block = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

# Code blocks get classes, not inline style= attributes (the site allows none).
[markup.highlight]
  noClasses = false
